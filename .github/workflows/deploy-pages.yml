name: Deploy docs to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install librsvg for SVG conversion
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Copy existing PNG logo if available
        run: |
          mkdir -p docs/assets
          if [ -f icons/logo.png ]; then
            cp icons/logo.png docs/assets/logo-128.png
          fi

      - name: Convert SVG to PNG using rsvg-convert
        run: |
          mkdir -p docs/assets
          rsvg-convert -w 128 -h 128 icons/logo.svg -o docs/assets/logo-128.png

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./docs
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
